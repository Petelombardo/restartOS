# restartOS podman settings. Keep your changes with: sudo make-persistent add /etc/podman.conf
#
# ENABLED=1  mount DEVICE on FOLDER at boot, keep container storage there and run
#            every compose file in FOLDER/podman/<service>/*.yml (pihole last)
# TYPE=root  rootful podman (storage FOLDER/var/lib/containers)
# TYPE=user  rootless as restartos (storage FOLDER/containers); ports below 1024
#            need net.ipv4.ip_unprivileged_port_start lowered
# DEVICE     by label, since sdX/mmcblkN numbering changes between boots: install-usb
#            makes partition 3 of an x86 stick "restartos-data" (on another disk:
#            sudo e2label /dev/sdXN restartos-data, or name its device here)
ENABLED=0
DEVICE="/dev/disk/by-label/restartos-data"
FOLDER="/mnt/usb"
TYPE=root
