# EMEET OfficeCore M1A reports a bogus dB range for its hardware volume (0..0.39 dB
# over its 0..100 steps). With it, PipeWire parks the device at min or max and does
# the rest in software (all-or-nothing steps, LEDs out of sync with the system).
# ignore-dB makes PipeWire map volume across the raw steps instead, so the device
# volume (and its LEDs) follow the system volume.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-EMEET_EMEET_OfficeCore_M1A.*" }
    ]
    actions = {
      update-props = {
        api.alsa.ignore-dB = true
      }
    }
  }
]
