<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- restartOS: emoji always come from Noto Color Emoji. DejaVu, Symbola and
     Noto Sans Symbols 2 carry black-and-white copies of many emoji and win the
     fallback, so newer emoji show in colour and older ones as outlines. Drop the
     emoji blocks from those fonts (only emoji; their other symbols stay). -->
<fontconfig>
  <match target="scan">
    <test name="family" compare="contains"><string>DejaVu</string></test>
    <edit name="charset" mode="assign"><minus><name>charset</name>
      <charset><range><int>0x1F000</int><int>0x1FAFF</int></range></charset>
    </minus></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Symbola</string></test>
    <edit name="charset" mode="assign"><minus><name>charset</name>
      <charset><range><int>0x1F000</int><int>0x1FAFF</int></range></charset>
    </minus></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans Symbols 2</string></test>
    <edit name="charset" mode="assign"><minus><name>charset</name>
      <charset><range><int>0x1F000</int><int>0x1FAFF</int></range></charset>
    </minus></edit>
  </match>
</fontconfig>
