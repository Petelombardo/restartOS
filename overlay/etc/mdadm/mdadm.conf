# restartOS: stands in for the mdadm.conf that mdadm's postinst generates (mkconf).
# No ARRAY lines: udev assembles every array it finds (mdadm --incremental).
# HOMEHOST <ignore>: the hostname differs per machine (restartos-<MAC>), so treat
# every array as local and keep its own name (/dev/md/<name>) instead of md127.
HOMEHOST <ignore>
DEVICE partitions containers
MAILADDR root
