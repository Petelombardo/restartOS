# initramfs-tools config for the restartOS initrd (mkinitramfs -d initrd/conf).
# The restartOS part (find the boot media, copy the images into RAM, stack them
# as an overlay root) is added by hooks/restartos.
MODULES=most
BUSYBOX=y
# gzip: every board's u-boot/kernel handles it (make wraps it with mkimage for uInitrd)
COMPRESS=gzip
COMPRESSLEVEL=9
DEVICE=
NFSROOT=auto
RUNSIZE=10%
FSTYPE=auto
